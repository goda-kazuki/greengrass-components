# ComponentVersion と Manifests[0].Artifacts[0].URI は仮の値。
# デプロイ処理を整備する際に、実際の値へ書き換える仕組みを追加する。
RecipeFormatVersion: "2020-01-25"
ComponentName: "com.example.Scd40Publisher"
ComponentVersion: "0.0.0"
ComponentDescription: "SCD40センサーのCO2・温度・湿度をAWS IoT Coreへ定期送信するコンポーネント"
ComponentPublisher: "greengrass-components"
ComponentConfiguration:
  DefaultConfiguration:
    topicName: "greengrass-components/scd40-publisher/{iot:thingName}/telemetry"
    measurementIntervalSeconds: "60"
    # topicName をデプロイ時に上書きする場合は、下の resources も
    # 上書き後のトピックに一致するよう広げる／変更すること。
    accessControl:
      aws.greengrass.ipc.mqttproxy:
        "com.example.Scd40Publisher:mqttproxy:1":
          policyDescription: "SCD40テレメトリのIoT Coreへのpublishを許可"
          operations:
            - "aws.greengrass#PublishToIoTCore"
          resources:
            - "greengrass-components/scd40-publisher/*/telemetry"
Manifests:
  - Platform:
      os: linux
    Lifecycle:
      Install:
        Script: pip3 install --user -r {artifacts:decompressedPath}/scd40-publisher/requirements.txt
        Timeout: 600
      Run: |
        GG_TOPIC_NAME="{configuration:/topicName}" GG_MEASUREMENT_INTERVAL_SECONDS="{configuration:/measurementIntervalSeconds}" PYTHONPATH="{artifacts:decompressedPath}/scd40-publisher/src" python3 -m scd40_publisher.main
    Artifacts:
      - URI: "s3://PLACEHOLDER_BUCKET/scd40-publisher/0.0.0/scd40-publisher.zip"
        Unarchive: ZIP
